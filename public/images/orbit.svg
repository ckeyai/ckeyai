<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2ecda"/>
      <stop offset="0.55" stop-color="#dcd4be"/>
      <stop offset="1" stop-color="#a8a08a"/>
    </linearGradient>
    <radialGradient id="violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5c6bff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5c6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#aeb9ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#aeb9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" gradientUnits="userSpaceOnUse" cx="600" cy="336" r="640">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask"><rect width="1200" height="720" fill="url(#fade)"/></mask>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0.05 0"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#12172e"/>
  <ellipse cx="560" cy="300" rx="400" ry="340" fill="url(#violet)" opacity="0.85" filter="url(#soft)"/>
  <ellipse cx="1020" cy="620" rx="320" ry="260" fill="url(#cyan)" opacity="0.4" filter="url(#soft)"/>
  <rect width="1200" height="720" fill="url(#grid)" mask="url(#gridmask)"/>
  <defs><clipPath id="lensclip"><circle cx="512" cy="344" r="198"/></clipPath></defs>
  <circle cx="512" cy="344" r="198" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="688" cy="344" r="198" fill="none" stroke="#5c6bff" stroke-opacity="0.45"/>
  <g clip-path="url(#lensclip)"><circle cx="688" cy="344" r="198" fill="url(#violet)" opacity="0.3"/></g>
  <ellipse cx="600" cy="344" rx="356" ry="128" transform="rotate(-18 600 344)" fill="none" stroke="url(#gold)" stroke-opacity="0.4"/>
  <circle cx="263.6" cy="416.2" r="10" fill="#dcd4be" fill-opacity="0.10"/>
  <circle cx="263.6" cy="416.2" r="3.4" fill="#dcd4be" fill-opacity="0.95"/>
  <circle cx="925.4" cy="293.0" r="10" fill="#aeb9ff" fill-opacity="0.10"/>
  <circle cx="925.4" cy="293.0" r="3.4" fill="#aeb9ff" fill-opacity="0.7"/>
  <path d="M112 344H1088" stroke="#ffffff" stroke-opacity="0.05"/>
  <path d="M600 116V572" stroke="#ffffff" stroke-opacity="0.04"/>
  <path d="M288 194h-14M912 194h14" stroke="#dcd4be" stroke-opacity="0.3"/>
  <path d="M288 344h-14M912 344h14" stroke="#dcd4be" stroke-opacity="0.3"/>
  <path d="M288 494h-14M912 494h14" stroke="#dcd4be" stroke-opacity="0.3"/>
  <g font-family="'SFMono-Regular',ui-monospace,Menlo,monospace" font-size="18" letter-spacing="4.2" fill="#ffffff" fill-opacity="0.26">
    <text x="60" y="654">FIG. 04</text>
    <text x="1140" y="654" text-anchor="end">CKEYAI / 2026</text>
  </g>
  <rect width="1200" height="720" filter="url(#noise)"/>
</svg>
